[project]
name = "diamond-hands"
version = "0.1.0"
description = "Facts-first swing-trading partner: trade plans, risk cards, price/level watch, analytics, paper book."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.scripts]
dh = "diamond_hands.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["diamond_hands"]

[tool.pytest.ini_options]
testpaths = ["tests"]
