# OPTIONAL. Diamond Hands runs with no config at all; every value below is the
# built-in default unless marked "example". To change anything, copy this file
# to config.yaml (git-ignored) and keep only the lines you want to override.

# timezone: America/New_York        # default: your computer's time zone
markets: [NYSE, NASDAQ]
base_currency: USD                  # USD or CAD (CAD converts at the Bank of Canada rate)

# Equity of your real trading account, in base_currency. Enables the risk card's
# "% of equity", size check and risk check; without it those checks show "?".
# account_equity: 50000             # example

core_holdings: []                   # long-term funds, never traded; fund-level news only. Example: [VTI, VXUS]

watchlist: []                       # example: [AMD, AVGO, MRVL, ARM, TSM, QCOM, INTC, MU]

# Read ONCE by `dh init` to seed the trade log. Usually easier: tell Claude what you
# hold, or run `dh trade buy TICKER --shares N --price P`.
swing_holdings: []
# swing_holdings:                   # example
#   - ticker: NVDA
#     shares: 20
#     avg_cost: 150.00
#     stop_close_below: 138.00
#     target_1: 166.00              # sell half here
#     out_by: 2026-12-31
#     entry_date: 2026-11-17        # optional; used for hold-length checks
#     account: IRA                  # optional label; "paper" is reserved

benchmarks:                         # ETFs, so every price source carries them
  us_index: SPY
  ca_index: XIU.TO
  sector: {}                        # optional per-ticker sector ETF, e.g. {NVDA: SOXX, AMD: SOXX}

rules:
  hold_weeks: [4, 8]
  target_1_pct: [10, 12]            # sell half
  t1_sell_fraction: 0.5
  after_target_1: breakeven_then_trail_higher_swing_lows
  stop_type: close_based            # intraday breaks do not trigger
  stop_distance_pct: [7, 10]
  trailing_lock_in_after_gain_pct: 10   # once up 10%, stop only moves up
  swing_lookback: 2                 # bars on each side that define a swing high/low
  risk_per_trade_pct: 1
  max_position_pct: 10
  max_open_ideas: 8

paper_book:
  enabled: true
  starting_capital: 100000
  benchmark: SPY                    # yardstick only

alerts:
  near_stop_band_pct: 1.5
  relative_volume_flag: 1.5         # x the 20-day average
  big_candle_body_pct: 3.0
  sentiment_shift_flag: 20          # point swing in bull-bear score (sentiment module, planned)
